<div class="col-xl-3 col-lg-4 col-md-6 video-wrapper" data-id="{{ID}}" id="video-{{ID}}">
	<div class="content p-3 position-relative video-list tag_video_grid_list mb-4">

		</a>

		<div class="info">
			<h4 title="{{TITLE}}" class="d-block text-truncate"><a href="{{URL}}" data-load="?link1=shorts&id={{VIDEO_ID_}}" class="black black-hover">{{TITLE}}</a></h4>

			<div class="d-flex align-items-center text-muted small foot">{{VIEWS}} {{LANG views}}<span class="mx-2">•</span>{{TIME}}</div>
			<div class="d-flex align-items-center text-muted small foot">{{LIKES}} {{LANG likes}}<span class="mx-2">•</span>{{DISLIKES}} {{LANG dislikes}}<span class="mx-2">•</span>{{COMMENTS}} {{LANG comments}}</div>
		</div>
		
		<hr class="my-3">
		
		<div class="d-flex align-items-center gap-10 flex-wrap">
			<a class="btn btn-main flex-1" href="{{LINK edit-video/{{ID}}}}" data-load="?link1=edit-video&id=category&id={{ID}}">

			<a class="btn btn-light flex-1 shadow-none" href="{{LINK view_analytics/{{V_ID}}}}&type=today" data-load="?link1=view_analytics&id={{V_ID}}&type=today" title="{{LANG view_analytics}}">
				{{LANG analytics}}
