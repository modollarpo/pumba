<script>
$("#thumbnail").change(function () {
	var filename = $(this).val().replace(/C:\\fakepath\\/i, '');
	$("#article_photo").text(filename).removeClass('d-none');
});

$.trumbowyg.svgPath = '{{CONFIG theme_url}}/css/trumbowyg.icons.svg';
$('#text').trumbowyg({
	btns: [
		['undo', 'redo'], // Only supported in Blink browsers
		['formatting'],
		['strong', 'em', 'del'],
		['superscript', 'subscript'],
		['link'],
		['insertImage'],
		['justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'],
		['unorderedList', 'orderedList'],
		['horizontalRule'],
		['removeformat'],
		['fullscreen']
	]
});

$(function () {
	var bar         = $('.progress-bar');

	$("#mySingleFieldTags").tagit({
		allowSpaces: true
	});

	$('#create_article_form').ajaxForm({
	    url: '{{LINK aj/articles/new-article}}?hash=' + $('.main_session').val(),
	    beforeSend: function() {
	    	$('#submit-btn').attr('disabled', true);
	    	$('#submit-btn').val("{{LANG please_wait}}");
	    	$('.progress').removeClass('d-none');
            var percentVal = '0%';
            bar.width(percentVal);
	    },
        uploadProgress: function(event, position, total, percentComplete) {
            var percentVal = percentComplete + '%';
            bar.width(percentVal);

            if (percentComplete == 100) {
               $('.progress').find('.bar').removeClass('upload-progress-bar');
            }
        },
	    success: function(data) {
	    	percentVal = '0%';
            bar.width(percentVal);
            $('.progress').addClass('d-none');
	    	if (data.status == 200) {
				$('.message').html("<div class='alert alert-info'>{{LANG reviewed_article}}</div>");
	    		setTimeout(function () {
	    			window.location.href = data.link;
	    		},3000)
	    	} 
	        else {
	    		$('#submit-btn').attr('disabled', false);
	    	    $('#submit-btn').val("{{LANG publish}}");
				$('.message').html("<div class='alert alert-danger'>"+ data.message +"</div>");
	    	}
	    }
	});
});
</script>
