<div class="pt-4 pb-5 container">
	<h2 class="mt-0 mb-3 display-4">{{LANG create_new_post}}</h2>
	
	<div class="mb-5 d-flex align-items-center justify-content-between tag_vid_page_nav">
		<div class="d-flex align-items-center py-1 tag_vid_page_sub_nav">
			<a href="{{LINK @{{ME username}}?page=activities}}" data-load="?link1=timeline&id={{ME username}}&page=activities" class="btn back px-0">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.57 5.92993L3.5 11.9999L9.57 18.0699" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.5 12H3.67004" stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/></svg> {{LANG go_back}}
			</a>
		</div>
	</div>
	
	<div class="content p-4">
		<form action="" class="" id="create_post_form" method="POST">
			<div class="message"></div>
			
			<div class="form-group">
				<textarea name="text" id="text" rows="8" placeholder=" " class="form-control"></textarea>
				<label for="text">{{LANG write_message}}</label>  
			</div>
			
			<div type="button" class="d-flex align-items-center mb-4 tag_point_earn" onclick="$('#image').trigger('click');">
				<div class="d-inline-flex align-items-center justify-content-center position-relative main icon">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z"></path></svg>
				</div>
				<div>
					<div class="h6 mb-0">{{LANG image}}</div>
					<div><small class="mt-1 form-text text-muted d-none text-truncate" id="article_photo"></small></div>
				</div>
			</div>

			<input id="image" name="image" type="file" class="d-none" accept="image/*">
			
			<div class="progress mb-4 d-none">
				<div class="progress-bar bg-success" role="progressbar"></div> 
			</div>
			
			<div class="pt-2">
				<button type="submit" id="submit-btn" class="btn btn-main btn-lg">{{LANG publish}}</button>
			</div>
		</form>
	</div>
</div>

<script>
$("#image").change(function () {
	var filename = $(this).val().replace(/C:\\fakepath\\/i, '');
	$("#article_photo").text(filename).removeClass('d-none');
});

$(function () {
	var bar         = $('.progress-bar');

	$('#create_post_form').ajaxForm({
	    url: '{{LINK aj/post/create}}?hash=' + $('.main_session').val(),
	    beforeSend: function() {
	    	$('#submit-btn').attr('disabled', true);
	    	$('#submit-btn').val("{{LANG please_wait}}");
	    	$('.progress').removeClass('d-none');
            var percentVal = '0%';
            bar.width(percentVal);
	    },
        uploadProgress: function(event, position, total, percentComplete) {
            var percentVal = percentComplete + '%';
            bar.width(percentVal);

            if (percentComplete == 100) {
               $('.progress').find('.bar').removeClass('upload-progress-bar');
            }
        },
	    success: function(data) {
	    	percentVal = '0%';
            bar.width(percentVal);
            $('.progress').addClass('d-none');
	    	if (data.status == 200) {
				$('.message').html("<div class='alert alert-success'>{{LANG post_created}}</div>");
	    		setTimeout(function () {
	    			window.location.href = data.link;
	    		},3000)
	    	} 
	        else {
	    		$('#submit-btn').attr('disabled', false);
	    	    $('#submit-btn').val("{{LANG publish}}");
				$('.message').html("<div class='alert alert-danger'>"+ data.message +"</div>");
	    	}
	    }
	});
});

</script>
