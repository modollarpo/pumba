<form class="content p-4" id="info-settings" method="POST">
    <div class="setting-info-alert"></div>
	
	<div class="form_info">
		<p class="lead mb-4">{{LANG to_download}}</p>

		<div class="custom-control custom-checkbox mb-2">
			<input type="checkbox" class="custom-control-input" name="my_information" id="my_information" value="1">
			<label class="custom-control-label" for="my_information">{{LANG my_information}}</label>
		</div>
		
		<div class="custom-control custom-checkbox mb-2">
			<input type="checkbox" class="custom-control-input" name="videos" id="videos" value="1">
			<label class="custom-control-label" for="videos">{{LANG videos}}</label>
		</div>
		
		<div class="custom-control custom-checkbox mb-2">
			<input type="checkbox" class="custom-control-input" name="subscribe" id="subscribe" value="1">
			<label class="custom-control-label" for="subscribe">{{LANG subscriptions}}</label>
		</div>
		
		<div class="custom-control custom-checkbox mb-2">
			<input type="checkbox" class="custom-control-input" name="posts" id="posts" value="1">
			<label class="custom-control-label" for="posts">{{LANG articles}}</label>
		</div>
		
		<div class="custom-control custom-checkbox mb-4">
			<input type="checkbox" class="custom-control-input" name="history" id="history" value="1">
			<label class="custom-control-label" for="history">{{LANG history}}</label>
		</div>

		<input type="hidden" name="hash_id" value="<?php echo PT_CreateSession()?>">
		<input type="hidden" name="user_id" value="{{USER id}}">

		<div class="pt-2">
			<button id="submit" name="submit" class="btn btn-main btn-lg">{{LANG generate_file}}</button>
		</div>
	</div>
	
	<div class="ready_to_down_info d-none">
		<svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="d-block mb-3 main"><path d="M12.5 2H12.7727C16.0339 2 17.6645 2 18.7969 2.79784C19.1214 3.02643 19.4094 3.29752 19.6523 3.60289C20.5 4.66867 20.5 6.20336 20.5 9.27273V11.8182C20.5 14.7814 20.5 16.2629 20.0311 17.4462C19.2772 19.3486 17.6829 20.8491 15.6616 21.5586C14.4044 22 12.8302 22 9.68182 22C7.88275 22 6.98322 22 6.26478 21.7478C5.10979 21.3424 4.19875 20.4849 3.76796 19.3979C3.5 18.7217 3.5 17.8751 3.5 16.1818V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.5 12C20.5 13.8409 19.0076 15.3333 17.1667 15.3333C16.5009 15.3333 15.716 15.2167 15.0686 15.3901C14.4935 15.5442 14.0442 15.9935 13.8901 16.5686C13.7167 17.216 13.8333 18.0009 13.8333 18.6667C13.8333 20.5076 12.3409 22 10.5 22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 7.5C4.99153 8.0057 6.29977 10 7 10M9.5 7.5C9.00847 8.0057 7.70023 10 7 10M7 10L7 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
		<p class="lead mb-4">{{LANG file_ready}}</p>
		
		<div class="pt-2">
			<a href="{{LINK aj/user/download_user_info}}" class="btn btn-main btn-lg" id="download_file" target="_blank" onclick="DeleteUserFile()">{{LANG download_file}}</a>
		</div>
	</div>
</form>

<script>
    $(function() {
        var form = $('form#info-settings');
        form.ajaxForm({
            url: '{{LINK aj/user/info}}?hash=' + $('.main_session').val(),
            beforeSend: function() {
                $('form#info-settings').find('button').text("{{LANG please_wait}}");
            },
            success: function(data) {
                scrollToTop();
                if (data.status == 200) {
                    $('.setting-info-alert').html('<div class="alert alert-success">' + data.message + '</div>');
                    $('.alert-success').fadeIn('fast', function() {
                        $(this).delay(2500).slideUp(500, function() {
                        	$('.form_info').addClass('d-none');
                        	$('.ready_to_down_info').removeClass('d-none');
                            $(this).remove();
                        });
                    });
                } else if (data.errors) {
                    var errors = data.errors.join("<br>");
                    $('.setting-info-alert').html('<div class="alert alert-danger">' + errors + '</div>');
                    $('.alert-danger').fadeIn(300);
                }
                $('form#info-settings').find('button').html('{{LANG generate_file}}');
            }
        });
    });
</script>
