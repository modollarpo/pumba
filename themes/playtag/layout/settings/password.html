<form class="content p-4" id="password-settings" method="POST">
    <div class="setting-password-alert"></div>

	<?php if (!PT_IsAdmin() || (PT_IsAdmin() && $pt->settings->admin == 1)) { ?>
		<div class="form-group">
			<input id="current_password" name="current_password" type="password" placeholder=" " class="form-control">
			<label for="current_password">{{LANG current_password}}</label>
		</div>
	<?php } ?>

	<div class="form-group">
		<input id="new_password" name="new_password" type="password" placeholder=" " class="form-control">
		<label for="new_password">{{LANG new_password}}</label>
	</div>

	<div class="form-group">
		<input id="confirm_new_password" name="confirm_new_password" type="password" placeholder=" " class="form-control">
		<label for="confirm_new_password">{{LANG confirm_new_password}}</label>
	</div>
	
	<input type="hidden" name="hash_id" value="<?php echo PT_CreateSession()?>">
	<input type="hidden" name="user_id" value="{{USER id}}">

	<div class="pt-2">
		<button id="submit" name="submit" class="btn btn-main btn-lg">{{LANG save}}</button>
	</div>
</form>

<script>
    $(function() {
        var form = $('form#password-settings');
        form.ajaxForm({
            url: '{{LINK aj/user/change-pass}}?hash=' + $('.main_session').val(),
            beforeSend: function() {
                form.find('button').text("{{LANG please_wait}}");
                // FL_progressIconLoader(form.find('button'));
            },
            success: function(data) {
                scrollToTop();
                if (data.status == 200) {
                    $('.setting-password-alert').html('<div class="alert alert-success">' + data.message + '</div>');
                    $('.alert-success').fadeIn('fast', function() {
                        $(this).delay(2500).slideUp(500, function() {
                            $(this).remove();
                        });
                    });
                } else if (data.errors) {
                    var errors = data.errors.join("<br>");
                    $('.setting-password-alert').html('<div class="alert alert-danger">' + errors + '</div>');
                    $('.alert-danger').fadeIn(300);
                }
                form.find('button').html('{{LANG save}}');
                // FL_progressIconLoader(form.find('button'));
            }
        });
    });
</script>
