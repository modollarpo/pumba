			<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z"></path></svg>

		<div>
			<div class="h6 mb-0">{{LANG cover}} {{LANG image}}</div>
			<div><small class="mt-1 form-text text-muted d-none text-truncate" id="cover_photo"></small></div>
		</div>
	</div>
	
	<div type="button" class="d-flex align-items-center mb-4 tag_point_earn" onclick="$('#avatar').trigger('click');">
		<div class="d-inline-flex align-items-center justify-content-center position-relative main icon">
			<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z"></path></svg>
		</div>
		<div>
			<div class="h6 mb-0">{{LANG avatar}} {{LANG image}}</div>
			<div><small class="mt-1 form-text text-muted d-none text-truncate" id="avatar_photo"></small></div>
		</div>
	</div>
	
	<div class="progress mb-4 d-none">
		<div class="progress-bar bg-success" role="progressbar"></div> 
	</div>

	<input type="hidden" name="hash_id" value="<?php echo PT_CreateSession()?>">
	<input type="hidden" name="user_id" value="{{USER id}}">
	<input type="file" class="d-none" id="cover" accept="image/x-png, image/gif, image/jpeg, image/webp" name="cover">
	<input type="file" class="d-none" id="avatar" accept="image/x-png, image/gif, image/jpeg, image/webp" name="avatar">

	<div class="pt-2">
		<button id="submit" name="submit" class="btn btn-main btn-lg">{{LANG save}}</button>
	</div>
</form>

<script>
    $(function() {
		$("#cover").change(function () {
			var filename = $(this).val().replace(/C:\\fakepath\\/i, '');
			$("#cover_photo").text(filename).removeClass('d-none');
		});
		$("#avatar").change(function () {
			var filename = $(this).val().replace(/C:\\fakepath\\/i, '');
			$("#avatar_photo").text(filename).removeClass('d-none');
		});

        var bar         = $('.progress-bar');

        var form = $('form#avatar-settings');
        form.ajaxForm({
            url: '{{LINK aj/user/avatar}}?hash=' + $('.main_session').val(),
            beforeSend: function() {
                form.find('button').text("{{LANG please_wait}}");
                $('.progress').removeClass('d-none');
                var percentVal = '0%';
                bar.width(percentVal);
            },
            uploadProgress: function(event, position, total, percentComplete) {
                var percentVal = percentComplete + '%';
                bar.width(percentVal);
            },
            success: function(data) {
                percentVal = '0%';
                bar.width(percentVal);
                $('.progress').addClass('d-none');
                scrollToTop();
                if (data.status == 200) {
                    $('.setting-avatar-alert').html('<div class="alert alert-success">' + data.message + '</div>');
                    $('.alert-success').fadeIn('fast', function() {
                        $(this).delay(2500).slideUp(500, function() {
                            $(this).remove();
                        });
                    });
                } else if (data.errors) {
                    var errors = data.errors.join("<br>");
                    $('.setting-avatar-alert').html('<div class="alert alert-danger">' + errors + '</div>');
                    $('.alert-danger').fadeIn(300);
                }
                form.find('button').html('{{LANG save}}');
                // FL_progressIconLoader(form.find('button'));
            }
        });
    });
</script>
