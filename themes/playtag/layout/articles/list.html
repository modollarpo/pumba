<div class="col-xl-4 col-lg-6 col-md-6 mb-4 pb-2 article-wrapper" data-id="{{ID}}" id="article-{{ID}}">
	<a href="{{URL}}" data-load="?link1=read&id={{ARTICLE_URL}}" class="black black-hover h-100 p-3 d-block position-relative tag_home_articles">
		<div class="embed-responsive embed-responsive-16by9 mb-3">
			<img class="embed-responsive-item" src="{{THUMBNAIL}}" alt="{{TITLE}}">
		</div>
		
		<div class="text-muted small mb-2">{{TIME}}</div>
		<h4>{{TITLE}}</h4>

		<p>{{DESC}}</p>
		
		<div class="main position-relative d-inline-block">{{LANG read_more}}</div>
	</a>
</div>
