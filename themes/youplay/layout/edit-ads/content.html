						<input type="text" id="title" name="title" class="form-control" placeholder=" " value="{{TITLE}}">
						<label for="title">{{LANG title}}</label>

					<div class="form-group">
						<textarea name="desc" id="desc" rows="5" class="form-control" placeholder=" ">{{DESC}}</textarea>

				<div class="col-lg-6">

						<select class="form-control selectpicker" multiple name="audience-list[]" data-live-search="true" title="{{LANG traget_audience}}" data-actions-box="true" name="audience-list[]">
							<?php foreach ($countries_name as $country_id => $country_name): ?>

						<input type="number" id="day_limit" name="day_limit" class="form-control" placeholder="0" value="{{DAY_LIMIT}}" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');">

				</div>

				<button type="submit" class="btn btn-main btn-lg" id="submit-btn">{{LANG save}}</button>

</div>

<script>
	jQuery(document).ready(function($) {
	  $('.selectpicker').selectpicker({});


    $('.user-ads-settings-form').ajaxForm({
      url: '{{LINK aj/ads/edit}}?hash=' + $('.main_session').val(),
      dataType:"json",
      data:{id:"{{ID}}"},
      beforeSend: function() {
        $('#submit-btn').attr('disabled', true).text("{{LANG please_wait}}");
      },
      success: function(data) {
        scrollToTop();
        
        if (data.status == 200){
          $(".user-ads-settings-alert").html('<div class="alert alert-success">'+
            data.message
            +'</div>');
          PT_Delay(function(){
            window.location.href = '{{LINK ads}}';
          },2000);
          
        }
        else {
          $('#submit-btn').removeAttr('disabled').text('{{LANG save}}');
          $(".user-ads-settings-alert").html('<div class="alert alert-danger">'+
            data.message
            +'</div>');
        }
      }
    });
	});
</script>
