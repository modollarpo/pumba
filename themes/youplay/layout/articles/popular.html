<div class="col-xl-12 col-lg-4 col-md-6 px-2 mb-4">
	<a href="{{URL}}" data-load="?link1=read&id={{ARTICLE_URL}}" class="black black-hover h-100 p-3 d-block position-relative tag_home_articles">
		<div class="embed-responsive embed-responsive-16by9 mb-3 d-none">
			<img class="embed-responsive-item" src="{{THUMBNAIL}}" alt="{{TITLE}}">
		</div>
		
		<div class="text-muted small mb-2">{{TIME}}</div>
		<h4>{{TITLE}}</h4>
		<div class="d-flex align-items-center small text-truncate">
			{{NAME}}
			<span class="mx-2">•</span>
			{{VIEWS}} {{LANG views}}
		</div>
	</a>
</div>
