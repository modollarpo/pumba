<div class="col-md-6 mb-4 pb-2" data-id="{{ID}}" id="article-{{ID}}">
	<a href="{{URL}}" data-load="?link1=read&id={{ARTICLE_URL}}" class="black black-hover h-100 p-3 d-flex align-items-center gap-15 position-relative tag_home_articles">
		<div class="flex-1">
			<div class="text-muted small mb-2">{{TIME}}</div>
			<h4>{{TITLE}}</h4>

			<p>{{DESC}}</p>
		
			<div class="main position-relative d-inline-block">{{USER name}}</div>
		</div>
		<img class="flex-0 rounded d-none d-lg-block thumb" width="150px" src="{{THUMBNAIL}}" alt="{{TITLE}}">
	</a>
</div>
