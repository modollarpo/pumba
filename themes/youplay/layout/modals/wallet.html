<div class="modal fade" id="pay_modal_wallet" role="dialog" data-keyboard="false">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">{{LANG pay_from_wallet}}</h5>
			</div>
			
			<div class="modal-body">
				<div class="pay_modal_wallet_alert"></div>
				<p class="pay_modal_wallet_text"></p>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-link" data-dismiss="modal">{{LANG cancel}}</button>
				<button type="button" class="btn btn-main" id="pay_modal_wallet_btn">{{LANG pay}}</button>
			</div>
		</div>
	</div>
</div>
