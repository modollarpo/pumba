<div class="col-lg-4 col-md-6 mb-4 pb-2 video-wrapper" data-id="{{ID}}" data-tr="{{ID}}">
	<div class="content border-0 h-100 p-3 d-block position-relative tag_home_articles">
		<a href="{{URL}}" data-load="?link1=watch&id={{VIDEO_ID_}}" class="embed-responsive embed-responsive-16by9 mb-3">
			<img class="embed-responsive-item" src="{{THUMBNAIL}}" alt="{{TITLE}}"></a>
		
		
		<div class="text-muted small mb-2">{{USER name_v}}</div>
		<h4><a href="{{URL}}" data-load="?link1=watch&id={{VIDEO_ID_}}" class="black black-hover">{{TITLE}}</a></h4>
	
		<div class="mt-2">
			<div>
				{{LANG rented}}: {{RENT_START}}
			</div>
			<div>
				{{LANG expiry}}: {{RENT_END}}
			</div>
		</div>
	</div>
</div>
