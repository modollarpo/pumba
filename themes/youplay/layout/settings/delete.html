<form class="content p-4" id="delete-settings" method="POST">
	<div class="setting-delete-alert"></div>

	<div class="form-group">
		<input id="current_password" name="current_password" type="password" placeholder=" " class="form-control">
		<label for="current_password">{{LANG current_password}}</label>
	</div>
	
	<input type="hidden" name="hash_id" value="<?php echo PT_CreateSession()?>">
	<input type="hidden" name="user_id" value="{{USER id}}">

	<div class="pt-2">
		<button id="submit" name="submit" class="btn btn-danger btn-lg">{{LANG delete}}</button>
	</div>
</form>

<script>
    $(function() {
        var form = $('form#delete-settings');
        form.ajaxForm({
            url: '{{LINK aj/user/delete}}?hash=' + $('.main_session').val(),
            beforeSend: function() {
                form.find('button').text("{{LANG please_wait}}");
                // FL_progressIconLoader(form.find('button'));
            },
            success: function(data) {
                scrollToTop();
                if (data.status == 200) {
                    $('.setting-delete-alert').html('<div class="alert alert-success">' + data.message + '</div>');
                    $('.alert-success').fadeIn('fast', function() {
                        $(this).delay(2500).slideUp(500, function() {
                            $(this).remove();
                        });
                    });
                    window.location.href = data.url;
                } else if (data.errors) {
                    var errors = data.errors.join("<br>");
                    $('.setting-delete-alert').html('<div class="alert alert-danger">' + errors + '</div>');
                    $('.alert-danger').fadeIn(300);
                }
                form.find('button').html('{{LANG delete}}');
                // FL_progressIconLoader(form.find('button'));
            }
        });
    });
</script>
