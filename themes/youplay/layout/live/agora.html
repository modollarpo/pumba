<script type="text/javascript">
	var stream = null;
	var whipPc = null;
	var whipResourceUrl = '';

	var channelName = "<?php echo($pt->stream_name) ?>";
	var mediamtxWhipUrl = "<?php echo(trim($pt->config->mediamtx_whip_url, '/')) ?>";
	var whipPublishUrl = mediamtxWhipUrl + '/' + channelName + '/whip';

	var devices = {cameras: [], mics: []};

	function ready() {

	  //Setup publish button
	  let pubBtn = document.getElementById('publishBtn');
	  if (pubBtn) {
	    pubBtn.onclick = evt => {
	      startBroadcast();
	    };
	  }

	  //Get users camera and mic
	  getMedia()
	    .then(str => {
	      stream = str;
	      //set cam feed to video window so user can see self.
	      let vidWin = document.getElementById('basic-stream');
	      if (vidWin) {
	        $('#basic-stream').removeClass('d-none');
	        $('.wow_go_live_btn').removeClass('d-none');
	        vidWin.srcObject = stream;
	      }
	      listDevices();
	    })
	    .catch(e => {
	      $('#remote-media').html('<div class="empty_state h-100 d-flex flex-column justify-content-center"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M3.27,2L2,3.27L4.73,6H4A1,1 0 0,0 3,7V17A1,1 0 0,0 4,18H16C16.2,18 16.39,17.92 16.54,17.82L19.73,21L21,19.73M21,6.5L17,10.5V7A1,1 0 0,0 16,6H9.82L21,17.18V6.5Z" fill="currentColor"></path></svg> getUserMedia Error: '+e+'</div>');
	    });
	}

	function listDevices() {
	  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
	    return false;
	  }
	  navigator.mediaDevices.enumerateDevices().then(function (list) {
	    devices.cameras = list.filter(function (d) { return d.kind === 'videoinput'; });
	    devices.mics = list.filter(function (d) { return d.kind === 'audioinput'; });
	    devices.cameras.forEach(function (cam, i) {
	      var name = cam.label || ('Camera ' + (i + 1));
	      $('#camera-list').append('<div class="dropdown-item"><a href="javascript:void(0);" id="camera_' + i + '">' + $('<span>').text(name).html() + '</a></div>');
	    });
	    devices.mics.forEach(function (mic, i) {
	      var name = mic.label || ('Mic ' + (i + 1));
	      $('#mic-list').append('<div class="dropdown-item"><a href="javascript:void(0);" id="mic_' + i + '">' + $('<span>').text(name).html() + '</a></div>');
	    });
	    $('#camera-list .dropdown-item a').click(function (event) {
	      changeDevice('video', event.target.id.split('_')[1]);
	    });
	    $('#mic-list .dropdown-item a').click(function (event) {
	      changeDevice('audio', event.target.id.split('_')[1]);
	    });
	  }).catch(function () {});
	}

	async function changeDevice(deviceType, deviceIndex) {
	  var arr = (deviceType === 'video') ? devices.cameras : devices.mics;
	  var selected = arr[parseInt(deviceIndex)];
	  if (!selected || !selected.deviceId) {
	    return false;
	  }
	  try {
	    var constraints = (deviceType === 'video')
	      ? {audio: false, video: {deviceId: {exact: selected.deviceId}}}
	      : {audio: {deviceId: {exact: selected.deviceId}}, video: false};
	    var newStream = await navigator.mediaDevices.getUserMedia(constraints);
	    var newTrack = newStream.getTracks()[0];
	    if (whipPc) {
	      var sender = whipPc.getSenders().find(function (s) { return s.track && s.track.kind === newTrack.kind; });
	      if (sender) {
	        await sender.replaceTrack(newTrack);
	      }
	    }
	    if (stream) {
	      stream.getTracks().forEach(function (t) {
	        if (t.kind === newTrack.kind) {
	          stream.removeTrack(t);
	          t.stop();
	        }
	      });
	      stream.addTrack(newTrack);
	    }
	  } catch (e) {
	    console.error('[MediaMTX] device switch failed', e);
	  }
	}

	function startBroadcast() {
	  var btn = document.getElementById('publishBtn');
	  if (btn) {
	    btn.disabled = true;
	    btn.textContent = "{{LANG please_wait}}";
	  }
	  whipPublish()
	    .then(function () {
	      var video_name = $('#live_video_name').val();
	      $.post("{{LINK aj/live/create}}", {stream_name: channelName, video_name: video_name}, function (data, textStatus, xhr) {
	        if (data.status == 200) {
	          $('#live_video_name').parent().remove();
	          $('#live_post_id').val(data.post_id);
	          $('.live_mic_cam_switch').slideDown();
	          $('#publishBtn').addClass('d-none');
	          $('.end_vdo_call').removeClass('d-none');
	          $('#main_live_video').html('<video id="local_live_preview" class="w-100 h-100" autoplay muted playsinline style="object-fit: contain; background: #000;"></video>');
	          $('#local_live_preview')[0].srcObject = stream;
	          setTimeout(function () {
	            var image = capture_video_frame('local_live_preview', 'png');
	            if (!image) {
	              return false;
	            }
	            var thumb   = new File([base64_2_blob(image.dataUri)], "thumb.png", {type: "image/png"});
	            var formData = new FormData();
	            formData.append('thumb', thumb);
	            formData.append('post_id', data.post_id);
	            $.ajax({
	              processData: false,
	              url: "{{LINK aj/live/create_thumb}}?hash=" + $('.main_session').val(),
	              type: 'POST',
	              dataType: 'json',
	              data: formData,
	              contentType: false
	            });
	          }, 1000);
	        }
	      });
	    })
	    .catch(function (e) {
	      console.error('[MediaMTX] publish failed', e);
	      $('#remote-media h3').removeClass('d-none');
	      $('#remote-media h3').text('Could not start live stream: ' + e.message);
	      $('#publishBtn').removeClass('d-none');
	      $('#publishBtn').text("{{LANG go_live}}");
	      $('#publishBtn').removeAttr('disabled');
	    });
	}

	async function whipPublish() {
	  if (!stream) {
	    throw new Error('no media stream');
	  }
	  var pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
	  whipPc = pc;
	  whipResourceUrl = '';

	  stream.getTracks().forEach(function (track) {
	    pc.addTrack(track, stream);
	  });

	  var offer = await pc.createOffer();
	  await pc.setLocalDescription(offer);

	  pc.onicecandidate = function (ev) {
	    if (ev.candidate && whipResourceUrl) {
	      fetch(whipResourceUrl, {method: 'POST', headers: {'Content-Type': 'application/trickle-ice-candidate'}, body: JSON.stringify(ev.candidate.toJSON())}).catch(function () {});
	    }
	  };

	  var res = await fetch(whipPublishUrl, {method: 'POST', headers: {'Content-Type': 'application/sdp'}, body: offer.sdp});
	  if (!res.ok) {
	    throw new Error('WHIP HTTP ' + res.status);
	  }
	  whipResourceUrl = res.headers.get('Location') || '';
	  var answer = await res.text();
	  await pc.setRemoteDescription({type: 'answer', sdp: answer});
	}

	function stopPublish() {
	  if (whipResourceUrl) {
	    fetch(whipResourceUrl, {method: 'DELETE'}).catch(function () {});
	    whipResourceUrl = '';
	  }
	  if (whipPc) {
	    whipPc.onicecandidate = null;
	    whipPc.close();
	    whipPc = null;
	  }
	}

	window.addEventListener('beforeunload', function () {
	  stopPublish();
	});
</script>
