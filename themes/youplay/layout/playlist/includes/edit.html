<form class="form create-new-list edit-list-form">
	<div class="modal-header px-0 pt-0">
		<h5 class="modal-title">{{LANG edit}} {{NAME}}</h5>
	</div>

	<div class="sa-create-list-alert"></div>
	
	<div class="form-group">
		<input type="text" class="form-control" value="{{NAME}}" placeholder=" ">
		<label>{{LANG pl_name}}</label>
	</div>
	<div class="form-group">
		<select class="form-control">
			<option value="1" selected="selected">{{LANG privacy}}</option>
			<option value="1" {{PUBLIC}}>{{LANG public}}</option>
			<option value="0" {{PRIVATE}}>{{LANG private}}</option>
		</select>
		<label>{{LANG privacy}}</label>
	</div>
	<div class="form-group mb-0">
		<textarea name="" id="" rows="3" class="form-control optional-field" placeholder=" ">{{DESC}}</textarea>
		<label>{{LANG description}}</label>
	</div>
</form>
