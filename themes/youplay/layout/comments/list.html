<div class="content p-4 mb-4 comment_info" id="comment_info_{{COMMENT_ID}}" data-comment-id="{{COMMENT_ID}}">
	<a href="{{URL}}" data-load="{{ajax_url}}" class="black black-hover d-inline-flex align-items-center gap-15 mb-4">
		<div class="flex-0 dash_comms">
			<div class="embed-responsive embed-responsive-16by9">
				<img src="{{THUMBNAIL}}" alt="{{TITLE}}" class="embed-responsive-item">
			</div>
		</div>
		
		<p class="mb-0 small text-muted bold">{{TITLE}}</p>
	</a>

	<div class="user-comments" id="video-user-comments">
		{{COMMENT}}
	</div>
</div>
