<div class="col-xl-3 col-lg-4 col-md-6">
	<div class="overflow-hidden content mb-5 tag_user_list" data-id="{{ID}}">
		<div class="embed-responsive embed-responsive-21by9">
			<a href="{{USER url}}" data-load="?link1=timeline&id={{USER username}}" class="embed-responsive-item">
				<img src="{{USER cover}}" alt="{{USER name}}" class="w-100 h-100">
			</a>
		</div>
		
		<div class="d-flex position-relative p-3 details">
			<div class="rounded-circle flex-0 thumb">
				<a href="{{USER url}}" data-load="?link1=timeline&id={{USER username}}">
					<img src="{{USER avatar}}" alt="{{USER name}}" class="w-100 h-100 rounded-circle">
				</a>
			</div>
			<div class="info">
				<h6 class="text-truncate mb-1"><a href="{{USER url}}" data-load="?link1=timeline&id={{USER username}}" class="black black-hover">{{USER name}}</a></h6>
				<p class="text-truncate mb-0">@{{USER username}}</p>
			</div>
		</div>
	</div>
</div>
